name: Deploy Binaries

on:
  workflow_dispatch:
    inputs:
      skip_maven:
        description: 'Skip deploy-maven (already published to Maven Central on a prior attempt)'
        type: boolean
        default: false
      skip_ios:
        description: 'Skip deploy-ios (already published to CocoaPods/SPM on a prior attempt)'
        type: boolean
        default: false
      skip_js:
        description: 'Skip deploy-js (already uploaded to R2 on a prior attempt)'
        type: boolean
        default: false
  push:
    tags:
      - mockzilla-v**
env:
  is_snapshot: ${{ github.ref_type == 'branch' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  finalise:
    environment: production
    runs-on: ubuntu-latest
    needs: [deploy-ios, deploy-maven, deploy-js]
    # `always()` is needed since otherwise Github will skip it if the previous was skipped
    # even though in this context that means it previously succeeded and this is a manual re-run
    # https://stackoverflow.com/questions/65844033/conditional-needs-in-github-actions
    if: >-
      always() &&
      (needs.deploy-ios.result == 'success' || needs.deploy-ios.result == 'skipped') &&
      (needs.deploy-maven.result == 'success' || needs.deploy-maven.result == 'skipped') &&
      (needs.deploy-js.result == 'success' || needs.deploy-js.result == 'skipped')
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: ${{ !env.is_snapshot }}
        with:
          release-type: simple
          skip-github-pull-request: true
  deploy-maven:
    environment: production
    runs-on: macos-26
    if: ${{ github.event.inputs.skip_maven != 'true' }}
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Install dependencies
        run: bundle install
      - name: Deploy package to Maven Central
        run: | 
          echo "is_snapshot: $is_snapshot"
          export GPG_TTY=$(tty)
          bundle exec fastlane publish_to_maven is_snapshot:$is_snapshot
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:  ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
  deploy-ios:
    environment: production
    runs-on: macos-26
    if: ${{ github.event.inputs.skip_ios != 'true' }}
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2.0'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Install dependencies
        run: bundle install
      - name: Deploy package to Github for SPM & Cocoapods
        run: bundle exec fastlane ios publish_swift_package is_snapshot:$is_snapshot
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          IOS_DEPLOY_URL: ${{ secrets.IOS_DEPLOY_URL }}

  deploy-js:
    environment: production
    name: Publish JS files to R2
    runs-on: macos-26
    if: ${{ github.event.inputs.skip_js != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: bundle install
      - name: Deploy JS artifacts to R2
        run: bundle exec fastlane deploy_js_artifacts_to_r2 is_snapshot:$is_snapshot
        env:
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
