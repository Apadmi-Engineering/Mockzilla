on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  actions: write

name: Release-Please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.PAT_BS }}