on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write
  actions: write

name: Release-Please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.PAT_BS }}

      - uses: actions/checkout@v6
        if: steps.release.outputs.mockzilla--release_created

      - name: Regenerate LLM reference docs
        if: steps.release.outputs.mockzilla--release_created
        run: |
          pip install -r docs/requirements.txt
          python docs/llms_hook.py
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/llms*.txt
          git diff --staged --quiet || git commit -m "chore: regenerate LLM reference docs [skip ci]"
          git push