name: Deploy Mobile Ui KMP Binaries

on:
  workflow_dispatch:
    inputs:
      skip_swift:
        description: 'Skip deploy-swift (already published to CocoaPods/SPM on a prior attempt)'
        type: boolean
        default: false
      skip_kotlin:
        description: 'Skip deploy-kotlin (already published to Maven Central on a prior attempt)'
        type: boolean
        default: false
      skip_js:
        description: 'Skip deploy-js (already uploaded to R2 on a prior attempt)'
        type: boolean
        default: false
      skip_flutter:
        description: 'Skip deploy-flutter (already published to pub.dev on a prior attempt)'
        type: boolean
        default: false
  push:
    tags:
      - mockzilla-mobile-ui-v**
env:
  is_snapshot: ${{ github.ref_type == 'branch' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}
  cancel-in-progress: false

jobs:
  deploy-flutter:
    environment: production
    needs: [ deploy-js ]
    runs-on: macos-26
    if: >-
      always() &&
      github.ref_type != 'branch' &&
      (needs.deploy-js.result == 'success' || needs.deploy-js.result == 'skipped') &&
      github.event.inputs.skip_flutter != 'true'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install dependencies
        run: bundle install
      - name: Download JS assets
        run: |
          export GPG_TTY=$(tty)
          bundle exec fastlane download_mockzilla_ui_mobile_js_assets
        env:
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.44.5'
          channel: 'stable'
      - run: cd FlutterMockzilla/mockzilla_ui_mobile; flutter pub get
      - name: Publish
        run: cd FlutterMockzilla/mockzilla_ui_mobile; flutter pub publish --force
  release-please:
    needs: [deploy-flutter]
    runs-on: macos-26
    if: >-
      always() &&
      (needs.deploy-flutter.result == 'success' || needs.deploy-flutter.result == 'skipped')
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        if: ${{ !env.is_snapshot }}
        with:
          release-type: simple
          skip-github-pull-request: true
  pre-deploy-checks:
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2.0'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
      - name: Install dependencies
        run: bundle install
      - name: Run pre-deploy checks
        run: |
          export GPG_TTY=$(tty)
          bundle exec fastlane management_ui_pre_deploy_checks
        env:
          IS_BUILDING_FOR_DEPLOYMENT: ${{ true }}
  deploy-swift:
    environment: production
    runs-on: macos-26
    needs: [pre-deploy-checks]
    if: ${{ github.event.inputs.skip_swift != 'true' }}
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2.0'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Install dependencies
        run: bundle install
      - name: Deploy package to Github for SPM & Cocoapods
        run: bundle exec fastlane ios publish_mobile_ui_swift_package is_snapshot:$is_snapshot
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
          IOS_MOBILE_UI_DEPLOY_URL: ${{ secrets.IOS_MOBILE_UI_DEPLOY_URL }}
          IS_BUILDING_FOR_DEPLOYMENT: ${{ true }}
  deploy-kotlin:
    environment: production
    runs-on: macos-26
    needs: [pre-deploy-checks]
    if: ${{ github.event.inputs.skip_kotlin != 'true' }}
    steps:
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.2.0'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '17'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Install dependencies
        run: bundle install
      - name: Deploy package to Maven Central
        run: |
          export GPG_TTY=$(tty)
          bundle exec fastlane publish_mobile_ui_to_maven is_snapshot:$is_snapshot
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword:  ${{ secrets.GPG_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
  deploy-js:
    environment: production
    name: Publish JS files to R2
    runs-on: macos-26
    needs: [ deploy-kotlin, deploy-swift]
    if: >-
      always() &&
      (needs.deploy-kotlin.result == 'success' || needs.deploy-kotlin.result == 'skipped') &&
      (needs.deploy-swift.result == 'success' || needs.deploy-swift.result == 'skipped') &&
      github.event.inputs.skip_js != 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: bundle install
      - name: Deploy JS artifacts to R2
        run: bundle exec fastlane deploy_mobile_ui_js_artifacts_to_r2 is_snapshot:$is_snapshot
        env:
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
