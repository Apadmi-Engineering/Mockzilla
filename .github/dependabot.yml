# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    groups:
      # Kotlin, KSP and kotlinx artifacts use separate version keys but must
      # move together, so keep them in one coordinated group (all update types).
      kotlin:
        applies-to: version-updates
        patterns:
          - "*kotlin*"
          - "com.google.devtools.ksp"
          - "*kotlinx*"
      # Compose Multiplatform + activity-compose share a release cadence.
      compose:
        applies-to: version-updates
        patterns:
          - "compose*"
      # Everything else: collapse all non-breaking (minor + patch) updates into
      # a single PR. Majors fall through to their own individual PRs.
      non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
        interval: "monthly"
    groups:
      all-github:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: 'bundler'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      ruby-updates:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: 'pub'
    directories:
      - '/FlutterMockzilla'
      - '/FlutterMockzilla/**'
    schedule:
      interval: 'monthly'
    groups:
      non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Documentation tooling (zensical) built with pip.
  - package-ecosystem: 'pip'
    directory: '/docs'
    schedule:
      interval: 'monthly'
    groups:
      non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Documentation homepage (Tailwind CSS) built with npm.
  - package-ecosystem: 'npm'
    directory: '/docs/homepage'
    schedule:
      interval: 'monthly'
    groups:
      non-breaking:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
