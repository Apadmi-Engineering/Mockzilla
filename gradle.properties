#Gradle
# The Kotlin/Native linker runs inside the Gradle daemon, so this heap must
# cover release-framework LTO. CI runners (macos-26 arm64) only have 7GB RAM,
# so every other JVM below is capped to keep the total footprint within that.
org.gradle.jvmargs=-Xmx5G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# Bound forked worker JVMs (KSP, C-interop, etc.); CI runners have 3 vCPUs.
org.gradle.workers.max=2

#Kotlin
kotlin.code.style=official
# Cap the Kotlin compile daemon so it doesn't compete with the Gradle daemon
# (and the K/N linker inside it) for RAM.
kotlin.daemon.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512M
# The commonizer forks its own JVM; cap it for the same reason.
kotlin.mpp.commonizerJvmArgs=-Xmx2G

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Temporary AGP 9 compatibility flags: keep the pre-9.0 Android DSL/plugin
# behavior while modules are migrated off kotlin.multiplatform + com.android.*
# to the new built-in-Kotlin / com.android.kotlin.multiplatform.library model.
# Removed once that migration is complete (these stop working in AGP 10).
android.builtInKotlin=false
android.newDsl=false

#MPP
kotlin.mpp.enableCInteropCommonization=true

signing.gnupg.executable=gpg

#Dokka
org.jetbrains.dokka.classpath.useNativeDistributionAccessor=true
