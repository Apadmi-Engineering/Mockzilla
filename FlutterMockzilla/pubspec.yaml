name: flutter_mockzilla

environment:
  flutter: '>=3.27.0'
  sdk: '>=3.6.0 <4.0.0'
dev_dependencies:
  melos: ^7.3.0

dependencies:
  flutter:
    sdk: flutter

workspace:
  - mockzilla
  - mockzilla_android
#  - mockzilla_web
  - mockzilla_ios
  - mockzilla_platform_interface

melos:
  scripts:
    buildExample:
      description: "Build example apps"
      run: >
        melos exec -c 1 "cd example &&
        flutter pub get &&
        flutter build apk &&
        flutter build ipa --no-codesign"
      packageFilters:
        scope: "mockzilla"
    buildConfig:android:
      description: "Builds config of Android example"
      run: >
        melos exec -c 1 "cd example && flutter build apk --config-only"
      packageFilters:
        scope: "mockzilla_android"
    buildConfig:ios:
      description: "Builds config of Ios example"
      run: >
        melos exec -c 1 "cd example && flutter build ios --config-only --no-codesign"
      packageFilters:
        scope: "mockzilla_ios"
    buildConfig:web:
      description: "Builds config of Web example"
      run: >
        melos exec -c 1 "cd example && flutter build web --config-only --no-codesign"
      packageFilters:
        scope: "mockzilla_ios"
    test:all:
      run: "melos run test:dart --no-select"
    test:dart:
      description: "Run Dart tests in a package"
      run: melos exec -c 1 "flutter test"
      packageFilters:
        dirExists:
          - test